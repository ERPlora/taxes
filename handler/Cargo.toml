[package]
name = "taxes-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:extism-pdk"]

[dependencies]
# El crate de contrato host↔guest vive en el workspace Rust del hub.
erplora-guest-sdk = { path = "../../../../hub/crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Aritmética decimal EXACTA (la comparte el guest-sdk, ADR-0123): fuera el f64+epsilon del IVA.
rust_decimal = { version = "1", default-features = false }

[profile.release]
opt-level = "s"

[workspace]
